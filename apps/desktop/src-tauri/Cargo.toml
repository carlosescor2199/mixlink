[package]
name = "mixlink-desktop"
version = "0.1.0"
edition = "2021"
description = "Read-only desktop shell for the MixLink server engine."
publish = false

[lib]
name = "mixlink_desktop"
crate-type = ["rlib"]

[[bin]]
name = "mixlink-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
personal-monitoring = { path = "../../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
