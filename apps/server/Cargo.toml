[package]
name = "personal-monitoring"
version = "0.1.0"
edition = "2021"

[lib]
name = "personal_monitoring"
path = "src/lib.rs"

[[bin]]
name = "personal-monitoring"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
ctrlc = "3.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
